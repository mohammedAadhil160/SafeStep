version: "3.9"

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: safestep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: safestep_db
      POSTGRES_USER: safestep
      POSTGRES_PASSWORD: safestep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safestep -d safestep_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safestep_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://safestep:safestep@db:5432/safestep_db
      APP_ENV: development
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app   # Hot-reload in dev

  # ── pgAdmin (optional, for DB inspection) ─────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: safestep_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@safestep.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
